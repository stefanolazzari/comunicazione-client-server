<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Client-Server</h1>
    <button onclick="getElenco()">richiedi elenco</button>

    <script>
        //funzione nel client che invia una richiesta su localhost:3000/elencofunghi
        async function getElenco(){
            const dato = await fetch("/elencofunghi");
            const datoJson = await dato.json();
            console.log(dato);
            //creo un paragrafo e lo aggiungo al body
            const elemento = document.createElement("p");
            elemento.innerHTML = JSON.stringify(datoJson, null, 2);
            document.body.appendChild(elemento);
        }
    </script>
</body>
</html>
